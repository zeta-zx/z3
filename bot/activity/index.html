<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zeta</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/activity.js"></script>
</head>
<body>
    <main class="workspace">
        <header>
            <div class="brand"><img src="/zeta.png" alt="">Zeta</div>
            <span class="status" id="status" role="status">Connect your player</span>
        </header>
        <div class="layout">
            <section class="player" aria-labelledby="title">
                <div class="cover" id="cover">
                    <img class="cover-mark" src="/zeta.png" alt="">
                    <img id="art" alt="" hidden>
                </div>
                <div class="track">
                    <h1 id="title">Now playing</h1>
                    <p id="artist">Connect Zeta to see the current track.</p>
                </div>
                <progress id="progress" value="0" max="1" aria-label="Playback progress"></progress>
                <div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div>
                <div class="controls">
                    <button type="button" data-command="previous" aria-label="Previous track" disabled>⏮</button>
                    <button type="button" data-command="toggle" class="playback" aria-label="Resume playback" disabled id="toggle">▶</button>
                    <button type="button" data-command="skip" aria-label="Next track" disabled>⏭</button>
                </div>
            </section>
            <section class="queue" aria-labelledby="queue-heading">
                <div class="pane-heading">
                    <h2 id="queue-heading">Up next</h2>
                    <button type="button" id="lyrics-toggle" aria-controls="lyrics-panel" aria-expanded="false">Lyrics</button>
                </div>
                <div id="queue-panel">
                <form id="search-form">
                    <label for="song">Find a song</label>
                    <input id="song" name="song" maxlength="200" placeholder="Song title or artist" required disabled>
                    <div class="search-actions">
                        <button name="action" value="play" class="primary" disabled>Play now</button>
                        <button name="action" value="playnext" disabled>Play next</button>
                    </div>
                </form>
                <p class="empty" id="empty">Your Zeta queue will appear here.</p>
                <ol id="tracks"></ol>
                </div>
                <div id="lyrics-panel" hidden>
                    <p id="lyrics-message">Connect Zeta to see lyrics.</p>
                    <div id="lyric-lines" class="lyric-lines" aria-label="Song lyrics" tabindex="0"></div>
                </div>
            </section>
        </div>
        <section class="connection" id="connection" aria-labelledby="connection-heading">
            <div>
                <h2 id="connection-heading">Connect to your Zeta player</h2>
                <p id="guidance">Open Zeta Music and connect it to Wayship. Then link this Activity from Discord.</p>
                <code id="code" hidden></code>
            </div>
            <button type="button" class="primary" id="link">Get link code</button>
            <button type="button" id="unlink" hidden>Disconnect Activity</button>
        </section>
        <p id="feedback" role="status" aria-live="polite" hidden></p>
    </main>
</body>
</html>
