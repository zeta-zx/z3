name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  # Lets you re-run the pipeline for an existing tag (e.g. to re-upload assets
  # after a failed publish) without having to delete and re-push the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.2.0)'
        required: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Never let two runs for the same tag publish at once.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release ONCE, up front, and guarantee it is a DRAFT.
  #
  # Two things depend on this:
  #  1. Pre-creating it stops the three matrix jobs below from racing to create
  #     it (the loser used to die with 422 already_exists on tag_name).
  #  2. It MUST be a draft. electron-builder refuses to upload to an already
  #     published release when `releaseType` is "draft": it logs
  #     "GitHub release not created / existing type not compatible" and then
  #     *silently skips* every upload while still exiting 0 — which is how
  #     v0.2.0 ended up published with zero assets.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Ensure a draft release exists for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "Draft release $RELEASE_TAG already exists - reusing it."
            else
              echo "Release $RELEASE_TAG is already published; reverting it to a draft so assets can be uploaded."
              gh release edit "$RELEASE_TAG" --draft=true
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One platform failing shouldn't cancel the others; the release stays a
      # draft so a partial upload is never shown to users.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot dpkg-dev dpkg

      - name: Install node dependencies
        run: npm ci

      - name: Compile SvelteKit and Electron
        run: npm run build

      - name: Build and publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish=always

  # Flip the draft into a real release only after every platform has uploaded,
  # so electron-updater clients never see a half-finished release.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Guard against electron-builder having silently skipped its uploads:
          # never publish an empty release, fail loudly and leave it as a draft.
          count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          echo "$RELEASE_TAG has $count asset(s)."
          if [ "$count" -eq 0 ]; then
            echo "::error::No assets were uploaded to $RELEASE_TAG - refusing to publish an empty release."
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false
