name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

# Never let two runs for the same tag publish at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release ONCE, up front, as a draft.
  #
  # Previously the three matrix jobs below each ran `electron-builder --publish`,
  # and all three tried to create the release for the tag. Whichever job got
  # there first won; the others failed with
  #   HttpError: 422 ... {"resource":"Release","code":"already_exists","field":"tag_name"}
  # Pre-creating the release means the build jobs only ever *upload* to it.
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create draft release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # One platform failing shouldn't cancel the others; the release stays a
      # draft so a partial upload is never shown to users.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools fakeroot dpkg-dev dpkg

      - name: Install node dependencies
        run: npm ci

      - name: Compile SvelteKit and Electron
        run: npm run build

      - name: Build and publish with electron-builder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --publish=always

  # Flip the draft into a real release only after every platform has uploaded,
  # so electron-updater clients never see a half-finished release.
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
